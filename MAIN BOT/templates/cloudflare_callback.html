<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Connection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 32px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .message { color: #999; font-size: 14px; margin-bottom: 24px; }
    .btn {
      background: #f6821f;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { background: #e67318; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <div class="title" id="title">Connecting to Cloudflare...</div>
    <div class="message" id="message">Please wait while we verify your account.</div>
    <button class="btn" id="closeBtn" style="display:none" onclick="window.close()">Close</button>
  </div>

  <script>
    const API_BASE = 'https://153.75.247.105:8000';
    
    const iconEl = document.getElementById('icon');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const closeBtn = document.getElementById('closeBtn');

    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        iconEl.textContent = '❌';
        titleEl.textContent = 'Authorization Failed';
        messageEl.textContent = `Error: ${error}`;
        closeBtn.style.display = 'inline-block';
        return;
      }

      if (!code || !state) {
        iconEl.textContent = '❌';
        titleEl.textContent = 'Missing Parameters';
        messageEl.textContent = 'No authorization code received from Cloudflare.';
        closeBtn.style.display = 'inline-block';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/cloudflare/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`);
        const data = await response.json();

        if (response.ok && data.success) {
          iconEl.textContent = '✅';
          iconEl.classList.add('success');
          titleEl.textContent = 'Connected!';
          messageEl.textContent = `Account "${data.accountName || 'Cloudflare'}" connected successfully.`;
          
          // Notify parent window
          if (window.opener) {
            window.opener.postMessage('cloudflare-connected', '*');
          }
          
          // Auto-close after 2 seconds
          setTimeout(() => window.close(), 2000);
        } else {
          iconEl.textContent = '❌';
          iconEl.classList.add('error');
          titleEl.textContent = 'Connection Failed';
          messageEl.textContent = data.detail || data.message || 'Failed to connect Cloudflare account.';
          closeBtn.style.display = 'inline-block';
        }
      } catch (err) {
        iconEl.textContent = '❌';
        iconEl.classList.add('error');
        titleEl.textContent = 'Network Error';
        messageEl.textContent = 'Could not reach the server. Please try again.';
        closeBtn.style.display = 'inline-block';
      }
    }

    handleCallback();
  </script>
</body>
</html>
